<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1f3356" />
    <title>Admin — AirThere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" />
    <link rel="icon" href="/assets/airthere-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <script src="/admin/admin.js" defer></script>
  </head>
  <body class="admin-body">
    <header class="site-header app-header">
      <a class="brand" href="/admin" aria-label="AirThere Admin">
        <img src="/assets/airthere-logo.svg" alt="AirThere" />
      </a>
      <nav aria-label="Admin">
        <a href="#customers">Customers</a>
        <a href="#projects">Projects</a>
        <a href="#shoots">Shoots</a>
        <a class="text-link" href="/">Public site</a>
      </nav>
      <p class="admin-operator" id="operator" hidden></p>
    </header>

    <main class="admin-main">
      <p class="eyebrow">Private operations</p>
      <h1 id="view-title">Customers</h1>
      <p class="admin-lead" id="view-lead">Create and maintain customer records. Passwords are stored as hashes only.</p>
      <p class="admin-status" id="status" role="status" aria-live="polite"></p>
      <div id="app"></div>
    </main>
  </body>
</html>
