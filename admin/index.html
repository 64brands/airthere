<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1f3356" />
    <title>Admin — AirThere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" />
    <link rel="icon" href="/assets/airthere-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <script src="/assets/lightbox.js" defer></script>
    <script src="/admin/admin.js" defer></script>
  </head>
  <body class="admin-body">
    <header class="site-header app-header">
      <a class="brand" href="/admin" aria-label="AirThere Admin">
        <img src="/assets/airthere-logo.svg" alt="AirThere" />
      </a>
      <nav aria-label="Admin">
        <a href="#customers">Clients</a>
        <a href="#projects">Projects</a>
        <a href="#shoots">Captures</a>
        <a class="text-link" href="/">Public site</a>
      </nav>
      <details class="admin-account" id="account" hidden>
        <summary>
          <span id="account-name"></span>
          <span class="admin-account-caret" aria-hidden="true">▾</span>
        </summary>
        <div class="admin-account-menu">
          <p class="admin-account-role" id="account-role"></p>
          <button type="button" id="admin-logout">Log out</button>
        </div>
      </details>
    </header>

    <main class="admin-main">
      <h1 id="view-title">Clients</h1>
      <p class="admin-lead" id="view-lead"></p>
      <p class="admin-status" id="status" role="status" aria-live="polite"></p>
      <div id="app"></div>
    </main>

    <footer class="admin-footer">
      <p class="admin-footer-mark">AirThere</p>
      <p>Construction progress reporting</p>
      <p class="admin-footer-copy">© <span id="admin-year"></span> AirThere</p>
    </footer>
  </body>
</html>
